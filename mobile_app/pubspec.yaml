name: caribbean-garden-companion
description: A Caribbean garden companion app to help optimize crop cultivation
publish_to: none

version: 0.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.6.0

  # State Management
  provider: ^6.1.0

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7

  # Navigation & Routing
  go_router: ^12.0.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Camera & Image Handling
  image_picker: ^1.0.4
  camera: ^0.10.5
  cached_network_image: ^3.3.0
  image: ^4.1.1

  # QR Code
  qr_flutter: ^4.0.0
  qr_code_scanner: ^1.0.1

  # Date & Time
  table_calendar: ^3.0.9
  timeago: ^3.6.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location Services
  geolocator: ^9.0.2
  geocoding: ^2.1.1

  # Networking
  http: ^1.1.0
  connectivity_plus: ^5.0.2

  # Data & Utilities
  uuid: ^4.0.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Form Validation
  email_validator: ^2.1.17

  # Charts & Statistics
  fl_chart: ^0.63.0

  # PDF Generation
  pdf: ^3.10.5
  printing: ^5.11.0

  # File Handling
  file_picker: ^5.4.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0

  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.6

  # Firebase Emulator
  firebase_core: ^2.24.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/crops/
    - assets/weather/
    - assets/lottie/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300

# Flutter Configuration
flutter_intl:
  enabled: true
